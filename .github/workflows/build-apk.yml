name: Build BrainPal Android APKs

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Build Debug and Release APKs
        run: |
          chmod +x ./ci-build-apk.sh
          ./ci-build-apk.sh

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BrainPal-APKs-${{ github.run_number }}
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish APKs to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "BrainPal v1.0.${{ github.run_number }}"
          body: "Automated build of BrainPal: Quit Scrolling (Debug & Release APKs)."
          files: dist/*.apk
          generate_release_notes: true
